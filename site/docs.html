<!doctype html>
<html lang="en" data-world="undertow" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SoulStack docs</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SoulStack" />
    <meta property="og:title" content="SoulStack docs" />
    <meta property="og:description" content="Setup, updating, supported agents, the immune system, skills and immune cells. Every page is also plain Markdown." />
    <meta property="og:url" content="https://soulstack.proxysoul.com/docs" />
    <meta property="og:image" content="https://soulstack.proxysoul.com/og/docs.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://soulstack.proxysoul.com/og/docs.png" />
    <meta name="description" content="SoulStack docs: setup, updating, supported agents, the immune system, skills and immune cells. Every page is also plain Markdown for agents." />
    <link rel="icon" href="/brand/logo-undertow.webp" />
    <link rel="alternate" type="text/markdown" href="/llms.txt" title="Docs index for agents" />
    <link rel="preload" href="/fonts/recursive-living.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (() => {
        const q = new URLSearchParams(location.search);
        const worlds = ["empryo", "soul", "coffee", "water", "crimson", "undertow"];
        const saved = JSON.parse(localStorage.getItem("soulstack-world") || "null");
        const world = q.get("world") || saved?.world || "undertow";
        const mode = q.get("mode") || saved?.mode || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        const r = document.documentElement;
        r.dataset.world = worlds.includes(world) ? world : "undertow";
        r.dataset.theme = mode === "light" ? "light" : "dark";
        r.dataset.motion = "still";
      })();
    </script>
    <script type="module" src="/src/docs.ts"></script>
  </head>
  <body>
    <header class="bar" data-bar></header>

    <main class="docs wrap">
      <nav class="docs-nav" aria-label="Docs" data-docs-nav></nav>
      <article class="docs-page">
        <div class="docs-meta">
          <a data-md-link href="/docs/getting-started.md"><span data-icon="scroll"></span>View as Markdown</a>
        </div>
        <div class="prose" data-docs-body></div>
      </article>
    </main>
  </body>
</html>
