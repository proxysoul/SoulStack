[package]
name = "hype-edit"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fframes = { version = "=1.3.1-rc.3", features = ["compile-time-svgtree", "cli"] }
fframes_skia_renderer = { version = "=1.3.1-rc.3", features = ["metal"] }
fframes_native_player = { version = "=1.3.1-rc.3", default-features = false, features = ["metal", "audio"] }

[target.'cfg(not(windows))'.dependencies]
fframes = { version = "=1.3.1-rc.3", features = ["h264", "libav-agree-gpl", "videotoolbox"] }

[lib]
name = "hype_edit"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "hype-edit"
path = "src/main.rs"

[workspace]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
